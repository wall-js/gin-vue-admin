# SCADA(FUXA) socket.io 的 WebSocket 升级头。
# map 必须位于 http 上下文；本文件由 nginx.conf 的 include conf.d/*.conf 载入，位置合法。
map $http_upgrade $scada_conn_upgrade_web {
    default upgrade;
    ''      close;
}

server {
    listen       8080;
    server_name localhost;

    #charset koi8-r;
    #access_log  logs/host.access.log  main;

    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
        try_files $uri $uri/ /index.html;
    }

    # SCADA(FUXA) 同源反向代理：/scada/* -> gva-server(Go ems 插件) -> scada:1881
    # 关键：绝不能 rewrite！FUXA 设置了 BASE_PATH=/scada，其 HTML、静态资源
    # （/scada/assets/...）与 socket.io（/scada/socket.io/...）全部位于 /scada 之下，
    # 剥掉前缀会像 /api 那样导致静态资源 404。proxy_pass 末尾不带 / 即原样透传。
    # 用 ^~ 提升优先级，避免被 / 的 try_files 兜底成前端 index.html。
    location ^~ /scada {
        proxy_pass http://177.7.0.12:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # socket.io WebSocket 升级（实时数据通道）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $scada_conn_upgrade_web;
        # socket.io 长轮询 / SSE 需要关闭缓冲并放宽超时
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
    }

    location /api {
        proxy_set_header Host $http_host;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/api/(.*)$ /$1 break;  #重写
        proxy_pass http://177.7.0.12:8888; # 设置代理服务器的协议和地址
     }

    location /api/swagger/index.html {
        proxy_pass http://127.0.0.1:8888/swagger/index.html;
     }
 }